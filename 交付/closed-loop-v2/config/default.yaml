# closed-loop-v2 默认配置
# 所有时间参数用户可精确调控：输入多久就是多久，程序只要求正数，不做取整或钳制。

observer:
  interval_seconds: 10        # Observer 轮询间隔（推荐 10s）
  stall_threshold_seconds: 300
  failure_threshold: 2
  early_warning:
    failure_first_occurrence: true   # 错误指纹首次出现即预警
    budget_usage_ratio: 0.8          # 预算消耗 80% 预警
  # —— 以下来自 sidecar 事件规则引擎（event_observer.py 直接读取）——
  activity_kinds: ["command", "mcp_tool", "approval", "error"]
  progress_kinds: ["file_change"]
  turn_diff_counts_as_progress: true
  l0_nudge_grace_seconds: 120   # 新 Worker 孵化宽限：早期工具报错多为自我纠正
  idle_audit_cooldown_seconds: 120  # 静默完成审计的最小间隔
  audit_cooldown_seconds: 60        # 同一任务两次审计的最小间隔

# sidecar 确定性告警规则（阈值全部在此，不硬编码）
thresholds:
  repeated_error:
    window_seconds: 600
    count: 3                  # 窗口内同指纹错误 >= 3 次才告警
    cooldown_seconds: 600
  no_progress:
    window_seconds: 300       # 5 分钟窗口（配合 5 分钟内短任务）
    min_activity_events: 8
    max_progress_events: 0    # 有活动但无进展 -> 告警
    cooldown_seconds: 300
    # weak: 文件编辑等弱进展也计入 NO_PROGRESS 抑制（thrash 由 diff 指纹
    # 告警兜底）；strong 模式需生产端有强进展发射器（gate pass 已接通，
    # 见 closed_loop._run_gate），无发射器时活动多的健康 worker 会被误报。
    progress_mode: weak

fingerprint:
  strip_ansi: true
  normalize_timestamps: true
  normalize_ids: true
  normalize_paths: true
  normalize_line_numbers: true
  collapse_whitespace: true
  max_length: 200

ao:
  base_url: "http://127.0.0.1:3001"
  request_timeout_seconds: 15
  sse_idle_timeout_seconds: 30
  poll_interval_seconds: 10

worker:
  model: "GLM-5.2"            # ao spawn --model；网关默认模型对 claude-code 会 403

auditor:
  audit_interval_seconds: 300 # 例行审计节奏（推荐 5 分钟）；有 TRIGGER 时立即审计

bus:
  max_hops_per_thread: 24
  max_audits_per_thread: 3
  overall_timeout_seconds: 600

roles:
  planner:
    model: claude            # 可选 claude / glm / kimi；禁止 codex
  auditor:
    model: claude
  verifier:
    model: claude
  worker:
    model: glm-5.2           # sidecar 实机验证过的 Worker 模型
  max_parallel_workers: 2

gate:
  timeout_seconds: 300
  output_limit_chars: 20000
