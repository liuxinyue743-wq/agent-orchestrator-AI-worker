[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closed-loop-agent-orchestrator"
version = "0.1.0"
description = "A minimal adapter for Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
clao = "closed_loop_agent_orchestrator.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
