# AO supervision sidecar default config.
# All rule thresholds live here — NOT hardcoded in src/.

ao:
  base_url: "http://127.0.0.1:3001"   # AO daemon REST base
  request_timeout_seconds: 15
  sse_idle_timeout_seconds: 30        # SSE connection resets when idle
  poll_interval_seconds: 10           # used by --watch polling mode

worker:
  model: "GLM-5.2"                    # passed to `ao spawn --model`; the
                                      # gateway default (deepseek-v4-pro)
                                      # 403s, so workers must pin GLM-5.2.

thresholds:
  repeated_error:
    window_seconds: 600               # look-back window (10 min)
    count: 3                          # >= N same-fingerprint errors in window -> alert
    cooldown_seconds: 600             # no re-alert for same key within cooldown
  no_progress:
    window_seconds: 900               # look-back window (15 min)
    min_activity_events: 8            # >= N activity events ...
    max_progress_events: 0            # ... with <= this many progress events -> alert
    cooldown_seconds: 900
    progress_mode: strong            # count only strong progress (test green/commit/gate).
                                     # set to "any" to also count weak (file edits).

fingerprint:
  strip_ansi: true
  normalize_timestamps: true          # ISO timestamps / durations -> <ts>
  normalize_ids: true                 # uuids / hex ids -> <id>
  normalize_paths: true               # windows paths, hash-ish segments -> <path>
  normalize_line_numbers: true        # app.py:42 -> app.py:<line>
  collapse_whitespace: true
  max_length: 200

runtime:
  events_file: "runtime/events.jsonl"
  alerts_file: "runtime/alerts.jsonl"

observer:
  # Which normalized activityKinds count as "activity" / "progress".
  activity_kinds:
    - "command"
    - "mcp_tool"
    - "approval"
    - "error"
  progress_kinds:
    - "file_change"                   # completed file_change counts as progress
  # Turns whose diff has >=1 modified file also emit a progress event.
  turn_diff_counts_as_progress: true
  # L0 nudges wait out this grace after a worker starts: early tool
  # "errors" are self-correction noise, and nudging mid-turn gets the send
  # rejected by AO ("turn already in flight") — which can kill the turn.
  l0_nudge_grace_seconds: 300
  # Quiet-completion (idle) audits are throttled to this interval.
  idle_audit_cooldown_seconds: 300
